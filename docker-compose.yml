# Rehand with Docker Compose:  docker compose up --build   then open http://localhost:8080
# Stop with Ctrl+C. Remove containers with "docker compose down" (add -v to wipe the database and uploads).
# Database browser (Adminer) at http://localhost:8081 (server db, user rehand, password rehand_dev, database rehand).
#
# Optional overrides go in a file called .env next to this one, for example:
#   DB_PASSWORD=something-else
#   APP_PORT=9090

services:
  db:
    image: mysql:8
    restart: unless-stopped
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_DATABASE: rehand
      MYSQL_USER: rehand
      MYSQL_PASSWORD: ${DB_PASSWORD:-rehand_dev}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rehand_root}
    ports:
      # Host port 3307 so it does not clash with a MySQL or XAMPP already using 3306
      - "${DB_HOST_PORT:-3307}:3306"
    volumes:
      - db-data:/var/lib/mysql
      # First start only: the same idempotent scripts the application also runs
      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./src/main/resources/data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
    healthcheck:
      # 127.0.0.1 forces TCP, which only works once the real server (not the init server) is up
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: "jdbc:mysql://db:3306/rehand?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false"
      DB_USERNAME: rehand
      DB_PASSWORD: ${DB_PASSWORD:-rehand_dev}
      UPLOAD_DIR: /app/uploads
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - uploads:/app/uploads

  # Database browser (Adminer): http://localhost:8081
  # Login: System "MySQL", Server "db", Username "rehand", Password "rehand_dev", Database "rehand"
  adminer:
    image: adminer:4
    restart: unless-stopped
    depends_on:
      - db
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "${ADMINER_PORT:-8081}:8080"

volumes:
  db-data:
  uploads:
