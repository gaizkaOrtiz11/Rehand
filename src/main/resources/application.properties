# =====================================================================
# Rehand: default (local development) configuration
# MySQL on localhost:3306, database "rehand", user "rehand".
# Override anything with environment variables, e.g. DB_PASSWORD.
# Profiles: "docker" (docker-compose) and "prod" read everything from the environment.
# =====================================================================
spring.application.name=rehand
server.port=${SERVER_PORT:8080}

#Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/rehand?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USERNAME:rehand}
spring.datasource.password=${DB_PASSWORD:rehand_dev}

# schema.sql is the single source of truth: Hibernate only validates it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Run schema.sql then data.sql at every start (both scripts are idempotent).
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

#Demo listings (24 items with photos) for the default development profile. Set to false to start empty.
app.load-demo-data=${APP_LOAD_DEMO_DATA:true}

#Templates
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.web.resources.cache.period=0

#Uploads 
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=48MB
app.upload-dir=${UPLOAD_DIR:./uploads}

#Errors: friendly pages, no internals leaked 
server.error.whitelabel.enabled=false
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
