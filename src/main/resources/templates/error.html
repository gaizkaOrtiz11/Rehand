<!DOCTYPE html>
<html lang="en">
<head th:replace="~{fragments/layout :: head('Error')}">
    <meta charset="utf-8">
    <title>Error | Rehand</title>
</head>
<body>

<header th:replace="~{fragments/layout :: header}"></header>

<main id="main">
    <div class="container container--medium">
        <section class="error-page" aria-labelledby="error-title">
            <p class="error-page__code" th:text="${status}">400</p>
            <h1 id="error-title">We could not complete that request</h1>
            <p>Check the address or go back and try again.</p>
            <div class="cluster">
                <a class="btn btn--primary" href="/" th:href="@{/}">Go to the home page</a>
                <a class="btn btn--secondary" href="/listings" th:href="@{/listings}">Browse listings</a>
            </div>
        </section>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
