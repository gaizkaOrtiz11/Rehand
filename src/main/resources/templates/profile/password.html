<!DOCTYPE html>
<html lang="en">
<head th:replace="~{fragments/layout :: headWithCss('Change password', '/css/account.css')}">
    <meta charset="utf-8">
    <title>Change password | Rehand</title>
    <link rel="stylesheet" href="/css/app.css">
    <link rel="stylesheet" href="/css/account.css">
</head>
<body>

<header th:replace="~{fragments/layout :: header}"></header>

<div th:replace="~{fragments/layout :: flash}"></div>

<main id="main">
    <div class="container container--narrow">
        <div class="page-header">
            <div>
                <h1>Change password</h1>
                <p>Enter your current password first, then choose a new one.</p>
            </div>
        </div>

        <form class="form panel panel--raised" action="/profile/password" th:action="@{/profile/password}"
              th:object="${passwordForm}" method="post">
            <div th:replace="~{fragments/forms :: globalErrors}"></div>

            <div th:replace="~{profile/fields :: passwordInput('currentPassword', 'Current password', 'current-password', null)}"></div>
            <div th:replace="~{profile/fields :: newPasswordInput('newPassword', 'New password', null)}"></div>
            <ul class="password-rules" id="password-rules" data-password-rules data-for="newPassword" aria-label="Password rules">
                <li data-rule="length">At least 8 characters</li>
                <li data-rule="letter">At least one letter</li>
                <li data-rule="digit">At least one digit</li>
            </ul>
            <div th:replace="~{profile/fields :: passwordInput('confirmNewPassword', 'Repeat the new password', 'new-password', null)}"></div>

            <div class="form-actions">
                <button class="btn btn--primary" type="submit">Change password</button>
                <a class="btn btn--ghost" href="/profile" th:href="@{/profile}">Cancel</a>
            </div>
        </form>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

<script src="/js/account.js" th:src="@{/js/account.js}" defer></script>
</body>
</html>
