<!DOCTYPE html>
<html lang="en">
<head th:replace="~{fragments/layout :: headWithCss('Edit profile', '/css/account.css')}">
    <meta charset="utf-8">
    <title>Edit profile | Rehand</title>
    <link rel="stylesheet" href="/css/app.css">
    <link rel="stylesheet" href="/css/account.css">
</head>
<body>

<header th:replace="~{fragments/layout :: header}"></header>

<div th:replace="~{fragments/layout :: flash}"></div>

<main id="main">
    <div class="container">
        <div class="page-header">
            <div>
                <h1>Edit profile</h1>
                <p>Change your photo and the details other members see.</p>
            </div>
        </div>

        <div class="profile">

            <section class="panel panel--raised profile-card" aria-labelledby="photo-title">
                <h2 id="photo-title">Profile photo</h2>
                <span th:replace="~{profile/fields :: avatar(${profileUser.avatarPath}, ${profileUser.username}, 'avatar-frame--xl')}"></span>

                <div class="avatar-actions">
                    <form class="form" action="/profile/avatar" th:action="@{/profile/avatar}" method="post" enctype="multipart/form-data">
                        <div class="field is-required">
                            <label class="label" for="avatar">Choose a new photo</label>
                            <input class="input" type="file" id="avatar" name="avatar" required
                                   accept="image/jpeg,image/png,image/webp" aria-describedby="avatar-help"
                                   data-preview="#avatar-preview">
                            <p class="field-hint" id="avatar-help">JPEG, PNG or WebP, up to 5 MB.</p>
                        </div>
                        <div class="preview-list" id="avatar-preview"></div>
                        <div class="form-actions">
                            <button class="btn btn--primary" type="submit">Upload photo</button>
                        </div>
                    </form>

                    <form class="form" action="/profile/avatar/remove" th:action="@{/profile/avatar/remove}" method="post"
                          th:if="${profileUser.avatarPath != null}" data-confirm="Remove your profile photo?">
                        <div class="form-actions">
                            <button class="btn btn--secondary" type="submit">Remove photo</button>
                        </div>
                    </form>
                </div>
            </section>

            <section aria-labelledby="details-title">
                <form class="form panel panel--raised" action="/profile/edit" th:action="@{/profile/edit}"
                      th:object="${profileForm}" method="post">
                    <h2 id="details-title">Your details</h2>
                    <div th:replace="~{fragments/forms :: globalErrors}"></div>

                    <div class="field is-required" th:classappend="${#fields.hasErrors('username') ? 'has-error' : ''}">
                        <label class="label" for="username">Username</label>
                        <input class="input" type="text" id="username" th:field="*{username}" required
                               minlength="3" maxlength="40" pattern="[A-Za-z0-9._\-]{3,40}" autocomplete="username"
                               title="3 to 40 letters, digits, dots, underscores or hyphens"
                               th:attr="aria-describedby='username-help',aria-invalid=${#fields.hasErrors('username') ? 'true' : 'false'}">
                        <div th:replace="~{fragments/forms :: fieldHelp('username', 'Letters, digits, dots, underscores and hyphens, 3 to 40 characters.')}"></div>
                    </div>

                    <div th:replace="~{profile/fields :: textInput('city', 'City', 'text', 'address-level2', false, null, 80, 'Optional. Shown on your profile and listings.')}"></div>

                    <div class="field" th:classappend="${#fields.hasErrors('bio') ? 'has-error' : ''}">
                        <label class="label" for="bio">Bio</label>
                        <textarea class="textarea" id="bio" th:field="*{bio}" rows="6" maxlength="500"
                                  data-char-count="bio-count"
                                  th:attr="aria-describedby='bio-help',aria-invalid=${#fields.hasErrors('bio') ? 'true' : 'false'}"></textarea>
                        <div th:replace="~{fragments/forms :: fieldHelp('bio', 'Optional. Tell buyers a little about yourself.')}"></div>
                        <p class="field-hint char-count" id="bio-count">Up to 500 characters</p>
                    </div>

                    <div class="form-actions">
                        <button class="btn btn--primary" type="submit">Save changes</button>
                        <a class="btn btn--ghost" href="/profile" th:href="@{/profile}">Cancel</a>
                    </div>
                </form>
            </section>

        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

<script src="/js/account.js" th:src="@{/js/account.js}" defer></script>
</body>
</html>
