<!DOCTYPE html>
<html lang="en">
<head th:replace="~{fragments/layout :: head('Page not found')}">
    <meta charset="utf-8">
    <title>Page not found | Rehand</title>
</head>
<body>

<header th:replace="~{fragments/layout :: header}"></header>

<main id="main">
    <div class="container container--medium">
        <section class="error-page" aria-labelledby="error-title">
            <p class="error-page__code">404</p>
            <h1 id="error-title">We could not find that page</h1>
            <p>The link may be old, or the listing may have been removed by its seller.</p>
            <div class="cluster">
                <a class="btn btn--primary" href="/" th:href="@{/}">Go to the home page</a>
                <a class="btn btn--secondary" href="/listings" th:href="@{/listings}">Browse listings</a>
            </div>
        </section>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
