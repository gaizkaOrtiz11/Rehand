<!DOCTYPE html>
<html lang="en">
<head th:replace="~{fragments/layout :: head('Something went wrong')}">
    <meta charset="utf-8">
    <title>Something went wrong | Rehand</title>
</head>
<body>

<header th:replace="~{fragments/layout :: header}"></header>

<main id="main">
    <div class="container container--medium">
        <section class="error-page" aria-labelledby="error-title">
            <p class="error-page__code">500</p>
            <h1 id="error-title">Something went wrong on our side</h1>
            <p>The problem has been logged. Please try again in a moment.</p>
            <div class="cluster">
                <a class="btn btn--primary" href="/" th:href="@{/}">Go to the home page</a>
                <a class="btn btn--secondary" href="/listings" th:href="@{/listings}">Browse listings</a>
            </div>
        </section>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
