# =====================================================================
# Profile "prod": run with --spring.profiles.active=prod behind Nginx.
# Every setting comes from an environment variable. DB_URL, DB_USERNAME
# and DB_PASSWORD have no default on purpose: the app refuses to start without them.
# =====================================================================
server.port=${SERVER_PORT:8080}
server.address=${SERVER_ADDRESS:127.0.0.1}
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=lax

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.sql.init.mode=${SQL_INIT_MODE:always}

spring.thymeleaf.cache=${THYMELEAF_CACHE:true}
spring.web.resources.cache.period=${STATIC_CACHE_SECONDS:86400}

app.upload-dir=${UPLOAD_DIR:/var/lib/rehand/uploads}
