# =====================================================================
# Profile "docker": used by docker-compose.yml (SPRING_PROFILES_ACTIVE=docker).
# Every setting comes from an environment variable.
# =====================================================================
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://db:3306/rehand?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USERNAME:rehand}
spring.datasource.password=${DB_PASSWORD:rehand_dev}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.sql.init.mode=${SQL_INIT_MODE:always}

spring.thymeleaf.cache=${THYMELEAF_CACHE:true}
spring.web.resources.cache.period=${STATIC_CACHE_SECONDS:3600}

app.upload-dir=${UPLOAD_DIR:/app/uploads}
